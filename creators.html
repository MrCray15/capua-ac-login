<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Council — Creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<section id="council" class="scene scene--active">
  <img class="welcome__bg" src="ac-marble.png" alt="">
  <div class="welcome__content">
    <p class="welcome__eyebrow">Behind the Creed</p>
    <h1 class="welcome__title"><span>The Council</span></h1>
    <p class="welcome__quote">Four names, one Brotherhood — the hands that built this sanctuary.</p>

    <div class="council-grid">
      <div class="council-card">
        <div class="council-card__avatar"><span>MC</span></div>
        <span class="council-card__name">Mike Capua</span>
      </div>
      <div class="council-card">
        <div class="council-card__avatar"><span>DD</span></div>
        <span class="council-card__name">Dave Del Rosario</span>
      </div>
      <div class="council-card">
        <div class="council-card__avatar"><span>GM</span></div>
        <span class="council-card__name">Gumba Michael</span>
      </div>
      <div class="council-card">
        <div class="council-card__avatar"><span>JP</span></div>
        <span class="council-card__name">James Palabay</span>
      </div>
    </div>

    <button class="btn btn--ghost" id="backToDashboard">Return to Sanctuary</button>
  </div>
</section>

<script src="creators.js"></script>
</body>
</html>
